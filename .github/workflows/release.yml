name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build MediaBridge
        shell: pwsh
        run: .\media_bridge\csharp\build.ps1
      - name: Upload two release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME .\dynamic_island.lua .\media_bridge\media_bridge.exe --clobber
