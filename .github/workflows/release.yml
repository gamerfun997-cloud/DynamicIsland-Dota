name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build MediaBridge
        shell: pwsh
        run: .\media_bridge\csharp\build.ps1
      - name: Save build files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-v2.5.3
          path: |
            dynamic_island.lua
            media_bridge/media_bridge.exe
      - name: Upload two release files
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME .\dynamic_island.lua .\media_bridge\media_bridge.exe --clobber
